server {
    server_name calendacha.ru;

    client_max_body_size 12m;
    ssi on;

    location = / {
        root /var/www/dacha-landing;
        try_files /index.html =404;
    }

    location ~ ^/(favicon.ico|favicon.svg|favicon-192.png|apple-touch-icon.png)$ {
        root /var/www/dacha-landing;
    }

    location = /billing/return {
        root /var/www/dacha-landing;
        try_files /return.html =404;
    }

    location = /og.png      { root /var/www/dacha-landing; }
    location = /robots.txt  { root /var/www/dacha-landing; }
    location = /sitemap.xml { root /var/www/dacha-landing; }
    location = /llms.txt { root /var/www/dacha-landing; charset utf-8; }
    location = /d70000371ed6a9a1224d919b4b29c1d36fb1455ae340a38678eb81c0de69c6d5.txt { root /var/www/dacha-landing; }
    location = /zen_j3IoHqf1BqoUCps42nbULdywpXnCTllXvbDFHygiWQUYDjkss7dgsB9O7luVPOZY.html { root /var/www/dacha-landing; }
    location = /privacy { root /var/www/dacha-landing; try_files /privacy.html =404; }
    location = /offer { root /var/www/dacha-landing; try_files /offer.html =404; }
    location = /account-deletion { root /var/www/dacha-landing; try_files /account-deletion.html =404; }

    # index.html — no-cache: без этого браузер может неделями не подтягивать новый деплой.
    # Хэшированные assets/*.js/*.css кэшируются как обычно.
    location = /app/index.html {
        alias /var/www/dacha-web/index.html;
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        alias /var/www/dacha-web/;
        try_files $uri $uri/ /app/index.html;
    }

    location /media-internal/ {
        internal;
        alias /var/www/dacha-media/;
    }

    location /_includes/ {
        root /var/www/dacha-landing;
        internal;
    }

    location /spravochnik/ {
        root /var/www/dacha-landing;
        try_files $uri $uri/ =404;
    }

    # Точный матч бьёт префиксный /blog/ ниже (статика лендинга) — иначе фид приложения
    # (GET /blog/feed) 404-ится вместо ответа от бэкенда (грабли 2026-09-03: воспроизводилось
    # только на calendacha.ru, на dacha.studio1008.com этот блок уже стоял).
    location = /blog/feed {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /blog/ {
        root /var/www/dacha-landing;
        try_files $uri $uri/ =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/dacha-landing;
    }

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 127.0.0.1:10443 ssl;
    ssl_certificate /etc/letsencrypt/live/calendacha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendacha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www — отдельное зеркало сбивало Яндекс.Вебмастер с выбора главного зеркала; склеиваем на non-www.
# ИСПРАВЛЕНО: $request_uri → $uri$is_args$args (надёжнее в цепочке двойного проксирования)
server {
    server_name www.calendacha.ru;
    return 301 https://calendacha.ru$uri$is_args$args;

    listen 127.0.0.1:10443 ssl;
    ssl_certificate /etc/letsencrypt/live/calendacha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendacha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ИСПРАВЛЕНО: $request_uri → $uri$is_args$args
server {
    listen 80;
    listen [::]:80;
    server_name calendacha.ru www.calendacha.ru;
    return 301 https://calendacha.ru$uri$is_args$args;
}
