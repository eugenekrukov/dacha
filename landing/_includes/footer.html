<script>
(function(){
  // подсветка текущего раздела в меню — сравниваем реальный путь страницы, а не серверный
  // флаг: шапка теперь один и тот же статический файл на всех страницах (SSI-include).
  var path = location.pathname;
  document.querySelectorAll('.nav-links a').forEach(function(a){
    var href = a.getAttribute('href');
    if (href === '/spravochnik/' && path.indexOf('/spravochnik/') === 0) a.classList.add('active');
    if (href === '/blog/' && path.indexOf('/blog/') === 0) a.classList.add('active');
  });
})();
(function(){
  // залогинен → показываем аватар+email вместо «Войти» (landing и API на одном домене,
  // токен — зеркало web-клиента, ключ dacha_token)
  const cta=document.getElementById('navCta');
  if(!cta)return;
  let token=null;
  try{token=localStorage.getItem('dacha_token');}catch(e){return;}
  if(!token)return;
  fetch('/auth/me',{headers:{Authorization:'Bearer '+token}})
    .then(r=>r.ok?r.json():null)
    .then(u=>{
      if(!u||!u.email)return;
      const letter=u.email.trim().charAt(0).toUpperCase();
      cta.classList.add('user');
      cta.setAttribute('aria-label','Открыть кабинет: '+u.email);
      cta.textContent='';
      const ava=document.createElement('span');ava.className='ava';ava.textContent=letter;
      const em=document.createElement('span');em.className='uemail';em.textContent=u.email;
      cta.appendChild(ava);cta.appendChild(em);
    })
    .catch(()=>{});
})();
</script>
